name: Database backup and restore drill

# Daily logical backup plus two independent restore checks:
#  - verify-backup restores the production dump into an ephemeral Postgres and
#    compares every row count with the manifest captured at dump time.
#  - restore-drill exercises scripts/db-backup.sh and scripts/db-restore-drill.sh
#    against a freshly migrated and seeded database in CI.
# The production database is never written to by this workflow.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_ARTIFACT: wpay-postgres-dump

jobs:
  backup:
    name: Dump production database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Preflight backup credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not configured; add it under Settings > Secrets and variables > Actions (production environment) before the scheduled backup can run"
            exit 1
          fi
          command -v pg_dump >/dev/null || { echo "::error::pg_dump is missing on the runner"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is missing on the runner"; exit 1; }
          if [ -n "$BACKUP_GPG_PASSPHRASE" ]; then
            echo "backup encryption: AES-256 symmetric (BACKUP_GPG_PASSPHRASE)"
          else
            echo "::warning::BACKUP_GPG_PASSPHRASE is not configured; the dump and its artifact are unencrypted"
          fi
      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: bash scripts/db-backup.sh "$RUNNER_TEMP/wpay.dump"
      - name: Record row-count manifest and metadata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/manifest.txt"
          tables="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;")"
          for table in $tables; do
            count="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"$table\";")"
            echo "$table=$count" >> "$RUNNER_TEMP/manifest.txt"
          done
          cat "$RUNNER_TEMP/manifest.txt"
          {
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pg_dump=$(pg_dump --version)"
            echo "server=$(psql "$DATABASE_URL" -Atc 'SHOW server_version;')"
            echo "database_size=$(psql "$DATABASE_URL" -Atc 'SELECT pg_size_pretty(pg_database_size(current_database()));')"
            echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP"/wpay.dump*.sha256)"
          } > "$RUNNER_TEMP/backup-metadata.txt"
          cat "$RUNNER_TEMP/backup-metadata.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_ARTIFACT }}
          path: |
            ${{ runner.temp }}/wpay.dump*
            ${{ runner.temp }}/manifest.txt
            ${{ runner.temp }}/backup-metadata.txt
          retention-days: 30
          if-no-files-found: error

  verify-backup:
    name: Restore production dump into scratch database
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: wpay
          POSTGRES_PASSWORD: wpay
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpay" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: wpay
      PGPASSWORD: wpay
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BACKUP_ARTIFACT }}
          path: ${{ runner.temp }}
      - name: Verify checksum and decrypt
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum -c wpay.dump*.sha256
          DUMP="$RUNNER_TEMP/wpay.dump"
          if [ -f "$RUNNER_TEMP/wpay.dump.gpg" ]; then
            if [ -z "$BACKUP_GPG_PASSPHRASE" ]; then
              echo "::error::the backup is encrypted but BACKUP_GPG_PASSPHRASE is not configured in this job"
              exit 1
            fi
            printf '%s' "$BACKUP_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --output "$DUMP" --decrypt "$RUNNER_TEMP/wpay.dump.gpg"
          fi
          pg_restore --list "$DUMP" >/dev/null
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
      - name: Restore and compare counts
        run: |
          set -euo pipefail
          createdb wpay_verify
          pg_restore --no-owner --no-privileges --exit-on-error \
            --dbname=wpay_verify "$DUMP"
          failed=0
          while IFS='=' read -r table expected; do
            [ -z "$table" ] && continue
            actual="$(psql -d wpay_verify -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"$table\";")"
            if [ "$actual" != "$expected" ]; then
              echo "MISMATCH $table: manifest=$expected restored=$actual"
              failed=1
            else
              echo "OK $table=$actual"
            fi
          done < "$RUNNER_TEMP/manifest.txt"
          source_migrations="$(psql -d wpay_verify -v ON_ERROR_STOP=1 -Atc "SELECT string_agg(migration_name, ',' ORDER BY migration_name) FROM _prisma_migrations WHERE finished_at IS NOT NULL;")"
          manifest_migrations="$(psql -d wpay_verify -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM _prisma_migrations;")"
          if [ -z "$source_migrations" ] || [ "$manifest_migrations" -eq 0 ]; then
            echo "::error::restored backup has no applied migrations"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::restored backup does not match manifest"; exit 1
          fi

  restore-drill:
    name: Scripted backup and restore drill
    # Runs independently of the production dump/verify jobs: it migrates and
    # seeds an ephemeral Postgres, so it validates the scripts even when the
    # DATABASE_URL secret is absent. The production database is not touched.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: wpay
          POSTGRES_PASSWORD: wpay
          POSTGRES_DB: wpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpay" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wpay:wpay@localhost:5432/wpay?schema=public
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: wpay
      PGPASSWORD: wpay
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed
        run: |
          pnpm db:generate
          pnpm --filter @wpay/database migrate
          pnpm db:seed
      - name: Backup, verify checksum, restore into scratch and compare
        env:
          POSTGRES_DB: wpay
          POSTGRES_USER: wpay
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/wpay-drill.dump"
          bash scripts/db-backup.sh "$dump"
          if [ -f "$dump.gpg" ]; then dump="$dump.gpg"; fi
          bash scripts/db-restore-drill.sh "$dump"
