name: Database backup and restore drill

# Daily logical backup plus two independent restore checks:
#  - verify-backup restores the production dump into an ephemeral Postgres and
#    compares every row count with the manifest captured at dump time.
#  - restore-drill exercises scripts/db-backup.sh and scripts/db-restore-drill.sh
#    against a freshly migrated and seeded database in CI.
# The production database is never written to by this workflow.

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

env:
  BACKUP_ARTIFACT: wpay-postgres-dump

jobs:
  backup:
    name: Dump production database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Preflight backup credentials
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          missing=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured. Add it as a production environment secret: Settings > Secrets and variables > Actions > Environments > production."
            missing=1
          fi
          if [ -z "$BACKUP_GPG_PASSPHRASE" ]; then
            echo "::error::BACKUP_GPG_PASSPHRASE is not configured. Production dumps must be encrypted and the verify job needs the passphrase to decrypt them. Add it as a production environment secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Required production backup secrets are missing; refusing to create or upload an unencrypted dump."
            exit 1
          fi
          command -v pg_dump >/dev/null || { echo "::error::pg_dump is missing on the runner"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is missing on the runner"; exit 1; }
          command -v gpg >/dev/null || { echo "::error::gpg is missing on the runner"; exit 1; }
          command -v node >/dev/null || { echo "::error::node is missing on the runner"; exit 1; }
          if ! node scripts/pg-url.mjs >/dev/null; then
            echo "::error::DATABASE_URL could not be normalized for PostgreSQL (check the scheme, host and user)."
            exit 1
          fi
          echo "backup encryption: AES-256 symmetric (BACKUP_GPG_PASSPHRASE)"
          echo "DATABASE_URL normalization: Prisma-only query parameters removed; libpq TLS/connection parameters preserved"
      - name: Create backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: bash scripts/db-backup.sh "$RUNNER_TEMP/wpay.dump"
      - name: Record row-count and migration manifest plus metadata
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Prisma's ?schema=public is not a libpq parameter. Normalize without
          # printing the URL or its credentials.
          PG_URL="$(node scripts/pg-url.mjs)"
          : > "$RUNNER_TEMP/manifest.txt"
          tables="$(psql "$PG_URL" -v ON_ERROR_STOP=1 -Atc "SELECT tablename FROM pg_tables WHERE schemaname = 'public' ORDER BY tablename;")"
          for table in $tables; do
            count="$(psql "$PG_URL" -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"$table\";")"
            echo "$table=$count" >> "$RUNNER_TEMP/manifest.txt"
          done
          cat "$RUNNER_TEMP/manifest.txt"
          psql "$PG_URL" -v ON_ERROR_STOP=1 -Atc \
            "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL ORDER BY migration_name;" \
            > "$RUNNER_TEMP/migrations.txt"
          if [ ! -s "$RUNNER_TEMP/migrations.txt" ]; then
            echo "::error::source database has no applied Prisma migrations"
            exit 1
          fi
          cat "$RUNNER_TEMP/migrations.txt"
          {
            echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pg_dump=$(pg_dump --version)"
            echo "server=$(psql "$PG_URL" -Atc 'SHOW server_version;')"
            echo "database_size=$(psql "$PG_URL" -Atc 'SELECT pg_size_pretty(pg_database_size(current_database()));')"
            echo "migration_count=$(wc -l < "$RUNNER_TEMP/migrations.txt")"
            echo "sha256=$(cut -d' ' -f1 "$RUNNER_TEMP"/wpay.dump*.sha256)"
          } > "$RUNNER_TEMP/backup-metadata.txt"
          cat "$RUNNER_TEMP/backup-metadata.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_ARTIFACT }}
          path: |
            ${{ runner.temp }}/wpay.dump*
            ${{ runner.temp }}/manifest.txt
            ${{ runner.temp }}/migrations.txt
            ${{ runner.temp }}/backup-metadata.txt
          retention-days: 30
          if-no-files-found: error

  verify-backup:
    name: Restore production dump into scratch database
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Environment secrets (including BACKUP_GPG_PASSPHRASE) are only exposed to
    # jobs that declare the environment; without this the decrypt step always
    # saw an empty passphrase.
    environment: production
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: wpay
          POSTGRES_PASSWORD: wpay
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpay" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: wpay
      PGPASSWORD: wpay
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BACKUP_ARTIFACT }}
          path: ${{ runner.temp }}
      - name: Verify checksum and decrypt
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          sha256sum -c wpay.dump*.sha256
          DUMP="$RUNNER_TEMP/wpay.dump"
          if [ -f "$RUNNER_TEMP/wpay.dump.gpg" ]; then
            if [ -z "$BACKUP_GPG_PASSPHRASE" ]; then
              echo "::error::the backup is encrypted but BACKUP_GPG_PASSPHRASE is not configured in this job"
              exit 1
            fi
            printf '%s' "$BACKUP_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --output "$DUMP" --decrypt "$RUNNER_TEMP/wpay.dump.gpg"
          fi
          pg_restore --list "$DUMP" >/dev/null
          echo "DUMP=$DUMP" >> "$GITHUB_ENV"
      - name: Restore and compare counts
        run: |
          set -euo pipefail
          createdb wpay_verify
          pg_restore --no-owner --no-privileges --exit-on-error \
            --dbname=wpay_verify "$DUMP"
          failed=0
          while IFS='=' read -r table expected; do
            [ -z "$table" ] && continue
            actual="$(psql -d wpay_verify -v ON_ERROR_STOP=1 -Atc "SELECT count(*) FROM \"$table\";")"
            if [ "$actual" != "$expected" ]; then
              echo "MISMATCH $table: manifest=$expected restored=$actual"
              failed=1
            else
              echo "OK $table=$actual"
            fi
          done < "$RUNNER_TEMP/manifest.txt"
          source_migrations="$(psql -d wpay_verify -v ON_ERROR_STOP=1 -Atc "SELECT string_agg(migration_name, ',' ORDER BY migration_name) FROM _prisma_migrations WHERE finished_at IS NOT NULL;")"
          restored_migrations="$(psql -d wpay_verify -v ON_ERROR_STOP=1 -Atc "SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL ORDER BY migration_name;")"
          manifest_migrations="$(cat "$RUNNER_TEMP/migrations.txt")"
          if [ -z "$source_migrations" ] || [ -z "$restored_migrations" ]; then
            echo "::error::restored backup has no applied migrations"
            failed=1
          elif [ "$restored_migrations" != "$manifest_migrations" ]; then
            echo "::error::restored migration set differs from the source manifest"
            printf '%s\n' "$manifest_migrations" > "$RUNNER_TEMP/expected-migrations.txt"
            printf '%s\n' "$restored_migrations" > "$RUNNER_TEMP/restored-migrations.txt"
            diff -u "$RUNNER_TEMP/expected-migrations.txt" "$RUNNER_TEMP/restored-migrations.txt" || true
            failed=1
          else
            echo "OK migrations=$(printf '%s\n' "$restored_migrations" | wc -l) applied"
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::restored backup does not match manifest"; exit 1
          fi

  restore-drill:
    name: Scripted backup and restore drill
    # Runs independently of the production dump/verify jobs: it migrates and
    # seeds an ephemeral Postgres, so it validates the scripts even when the
    # DATABASE_URL secret is absent. The production database is not touched.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: wpay
          POSTGRES_PASSWORD: wpay
          POSTGRES_DB: wpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wpay" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://wpay:wpay@localhost:5432/wpay?schema=public
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: wpay
      PGPASSWORD: wpay
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL URL regression tests
        run: pnpm test:scripts
      - name: Migrate and seed
        run: |
          pnpm db:generate
          pnpm --filter @wpay/database migrate
          pnpm db:seed
      - name: Backup, verify checksum, restore into scratch and compare
        env:
          POSTGRES_DB: wpay
          POSTGRES_USER: wpay
          # Throwaway value for the isolated drill only; it is not a production
          # secret and never decrypts a production artifact.
          BACKUP_GPG_PASSPHRASE: ci-restore-drill-only
        run: |
          set -euo pipefail
          dump="$RUNNER_TEMP/wpay-drill.dump"
          bash scripts/db-backup.sh "$dump"
          if [ -f "$dump.gpg" ]; then dump="$dump.gpg"; fi
          bash scripts/db-restore-drill.sh "$dump"

  notify-failure:
    name: Alert on backup failure
    needs: [backup, verify-backup, restore-drill]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      BACKUP_RESULT: ${{ needs.backup.result }}
      VERIFY_RESULT: ${{ needs.verify-backup.result }}
      DRILL_RESULT: ${{ needs.restore-drill.result }}
    steps:
      - name: Open or update a single operations issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = "Scheduled database backup failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The database backup workflow failed.",
              "",
              `- Run: ${runUrl}`,
              `- Event: \`${context.eventName}\``,
              `- Commit: \`${context.sha}\``,
              `- \`backup\`: \`${process.env.BACKUP_RESULT}\``,
              `- \`verify-backup\`: \`${process.env.VERIFY_RESULT}\``,
              `- \`restore-drill\`: \`${process.env.DRILL_RESULT}\``,
              "",
              "Required production environment secrets: `DATABASE_URL` and `BACKUP_GPG_PASSPHRASE`.",
              "Configure them under **Settings > Environments > production > Environment secrets**. Do not paste secret values into this issue.",
              "Recovery and secret setup: `docs/DISASTER_RECOVERY.md`.",
              "",
              "This issue is reused for repeat failures. Close it after the workflow succeeds.",
            ].join("\n");
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`commented on existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              core.info(`opened issue #${created.data.number}`);
            }
