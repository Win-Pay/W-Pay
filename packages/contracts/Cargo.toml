[workspace]
resolver = "2"
members = ["common", "contracts/*", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
soroban-sdk = "29.0.1"
wpay-common = { path = "common" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
