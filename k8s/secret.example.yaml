# Template only. Never commit real values; create the secret with
#   kubectl create secret generic wpay-secrets -n wpay --from-literal=...
# or let External Secrets / Sealed Secrets manage it.
apiVersion: v1
kind: Secret
metadata:
  name: wpay-secrets
  namespace: wpay
type: Opaque
stringData:
  DATABASE_URL: postgresql://REPLACE:REPLACE@postgres:5432/wpay?schema=public
  JWT_SECRET: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  # Required in production: shared rate-limit counters (managed Redis or the
  # in-cluster service). The API refuses to start without it.
  REDIS_URL: rediss://default:REPLACE@redis.example:6379
  SOROBAN_SOURCE_SECRET: ""
