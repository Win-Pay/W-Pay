apiVersion: apps/v1
kind: Deployment
metadata:
  name: wpay-web
  namespace: wpay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wpay-web
  template:
    metadata:
      labels:
        app: wpay-web
    spec:
      containers:
        - name: web
          image: ghcr.io/example/wpay-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: wpay-config
                  key: API_PUBLIC_URL
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wpay-web
  namespace: wpay
spec:
  selector:
    app: wpay-web
  ports:
    - port: 80
      targetPort: 3000
