apiVersion: v1
kind: ConfigMap
metadata:
  name: wpay-config
  namespace: wpay
data:
  NODE_ENV: production
  STELLAR_NETWORK: testnet
  API_PORT: "4000"
  API_PUBLIC_URL: https://api.wpay.example
  WEB_PUBLIC_URL: https://pay.wpay.example
  CORS_ORIGINS: https://pay.wpay.example,https://merchant.wpay.example,https://admin.wpay.example
  TRUST_PROXY: "1"
  INDEXER_PORT: "4100"
  LOG_LEVEL: info
