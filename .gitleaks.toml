# Gitleaks configuration. Extends the default rules and only allows the
# placeholder values that appear in documentation and example files.
[extend]
useDefault = true

[allowlist]
description = "Documentation placeholders and test fixtures"
paths = [
  '''\.env\.example$''',
  '''k8s/secret\.example\.yaml$''',
  '''packages/contracts/.*test_snapshots.*''',
  '''deployments/.*\.json$''',
]
regexes = [
  '''REPLACE(_WITH_[A-Z_]+)?''',
  '''wpay_local_only''',
  '''ci-only-secret-that-is-long-enough-for-validation''',
  '''test-secret-that-is-long-enough-for-validation''',
]
