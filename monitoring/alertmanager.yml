global:
  resolve_timeout: 5m

route:
  receiver: platform-oncall
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: platform-oncall
      repeat_interval: 30m

receivers:
  - name: platform-oncall
    # Replace with the team's real integration. No credentials are committed.
    webhook_configs:
      - url: "https://alerts.example.invalid/wpay"
        send_resolved: true
