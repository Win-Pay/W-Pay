packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"

# pnpm 10+ blocks postinstall scripts unless allowlisted. Prisma needs its
# engines script; esbuild needs its binary install. Nothing else is allowed.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - "@scarf/scarf"
  - "@swc/core"
