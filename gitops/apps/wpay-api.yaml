apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wpay-api
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/example/wpay.git
    targetRevision: main
    path: helm/wpay
    helm:
      valueFiles: [values.yaml, values-production.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: wpay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
